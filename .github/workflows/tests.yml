name: Library and GTK checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb dbus-x11 7zip
      - name: Syntax checks
        run: |
          bash -n ch_manager_pro_installer_v5.sh
          /usr/bin/python3 -m py_compile ch_manager_pro.py library_core.py
      - name: Backend and real GTK integration tests
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
