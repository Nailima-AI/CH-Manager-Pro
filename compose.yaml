services:
  ch-manager:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8899:8899"
    volumes:
      - ch-manager-data:/data
      # Optional server folders; make them writable by container UID 1000.
      # - /srv/clonehero/Songs:/songs
      # - /srv/clonehero/Archives:/archives
      # - /srv/clonehero/Downloads:/downloads
      # Or mount an NFS export directly (see the songs-nfs volume below):
      # - songs-nfs:/songs
volumes:
  ch-manager-data:
