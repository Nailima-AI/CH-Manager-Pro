# Settings come from .env next to this file: copy .env.example to .env and edit it.
# Every value has a default, so this also runs without a .env file.
services:
  ch-manager:
    build: .
    restart: unless-stopped
    init: true
    ports:
      # Published on every interface by default; set CH_WEB_BIND=127.0.0.1 for local/tunnel/proxy-only access.
      - "${CH_WEB_BIND:-0.0.0.0}:${CH_WEB_HOST_PORT:-8899}:8899"
    environment:
      CH_WEB_ALLOWED_HOSTS: ${CH_WEB_ALLOWED_HOSTS:-*}
      CH_WEB_TRUSTED_PROXIES: ${CH_WEB_TRUSTED_PROXIES:-}
      CH_WEB_SECURE_COOKIE: ${CH_WEB_SECURE_COOKIE:-false}
      CH_WEB_MAX_UPLOAD_MIB: ${CH_WEB_MAX_UPLOAD_MIB:-2048}
      CH_WEB_TOKEN: ${CH_WEB_TOKEN:-}
    volumes:
      - ch-manager-data:/data
      # A host path (e.g. /srv/clonehero/Songs) bind-mounts that folder; the default is a named volume.
      # Host folders must be writable by UID 1000, the user the container runs as.
      - ${CH_SONGS_DIR:-ch-manager-songs}:/songs
      - ${CH_ARCHIVES_DIR:-ch-manager-archives}:/archives
      - ${CH_DOWNLOADS_DIR:-ch-manager-downloads}:/downloads
    # Optional resource caps; see "Resource use" in README.md.
    # mem_limit: 256m
    # cpus: 1.0

volumes:
  ch-manager-data:
  ch-manager-songs:
  ch-manager-archives:
  ch-manager-downloads:
  # To mount an NFS export directly, set CH_SONGS_DIR=ch-manager-songs-nfs in .env and uncomment:
  # ch-manager-songs-nfs:
  #   driver: local
  #   driver_opts:
  #     type: nfs
  #     o: addr=192.168.1.10,rw,nfsvers=4.2
  #     device: ":/export/clonehero/Songs"
